version: v2
plugins:
  - local: protoc-gen-go
    out: server/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: server/gen
    opt: paths=source_relative
  - local: protoc-gen-es
    out: frontend/src/lib/gen
    opt: target=ts
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: comp/server/gen
